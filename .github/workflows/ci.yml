name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Portable / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run smoke

  package:
    name: Package install and security audit
    needs: portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack and install as a consumer
        run: |
          mkdir -p work/pack
          npm pack --pack-destination work/pack
          version=$(node -p "require('./package.json').version")
          npm install --prefix work/package-smoke "./work/pack/office-mcp-${version}.tgz"
      - run: node --import tsx tests/package.smoke.ts
      - run: npm audit --prefix work/package-smoke --omit=dev --audit-level=moderate
