name: Feature request
description: Propose an Office capability or workflow improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: User task and desired result
      description: Explain the workflow in concrete terms.
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Why the current tools are insufficient
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Platform and compatibility considerations
      description: Note whether desktop Office is required and whether files can be processed portably.
